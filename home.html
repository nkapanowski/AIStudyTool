<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Study Tool — Google Sign-In</title>

  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">

</head>
<body>
  <h1>AI Study Tool</h1>
  <button id="googleBtn">Sign in with Google</button>
  <button id="logoutBtn" style="display:none;">Log out</button>
  <pre id="out"></pre>

  <script type="module">
    import {
      auth,
      provider,
      signInWithPopup,
      signOut,
      onAuthStateChanged,
      getIdToken
    } from "/static/firebase_config.js";

    const googleBtn = document.getElementById("googleBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const out = document.getElementById("out");

    googleBtn.addEventListener("click", async () => {
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        const idToken = await getIdToken(user, true);

        const res = await fetch("/verify-token", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: idToken })
        });
        const data = await res.json();
        out.textContent = "Verified:\n" + JSON.stringify(data, null, 2);
      } catch (err) {
        out.textContent = "Login failed: " + err.message;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        googleBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        out.textContent = "Signed in as: " + (user.email || user.uid);
      } else {
        googleBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
        out.textContent = "Signed out.";
      }
    });
  </script>
</body>
</html>
